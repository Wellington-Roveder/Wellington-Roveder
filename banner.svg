<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg { fill: #12100e; }
      .accent { fill: #d48255; stroke: #d48255; }
      .text-tag { font-family: 'Space Mono', 'Courier New', monospace; font-size: 14px; fill: #d48255; letter-spacing: 2px; font-weight: 700; }
      .text-name { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 48px; fill: #ffffff; font-weight: 700; }
      .text-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 16px; fill: #ececec; font-weight: 400; }
      .timeline-num { font-family: 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #d48255; font-weight: 700; }
      .timeline-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; fill: #ffffff; font-weight: 700; letter-spacing: 1px; }
      .timeline-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #b08460; }
      .dot-grid { fill: #2a2522; }
      .divider { stroke: #2a2522; stroke-width: 1; }
      .path { stroke: #d48255; stroke-width: 1.5; opacity: 0.45; }
      .halo { fill: none; stroke: #d48255; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" class="bg" />

  <!-- Background Grid Dots (Right Side) -->
  <g class="dot-grid">
    <circle cx="750" cy="80" r="1.5"/><circle cx="1110" cy="80" r="1.5"/>
    <circle cx="750" cy="120" r="1.5"/><circle cx="1110" cy="120" r="1.5"/>
    <circle cx="750" cy="160" r="1.5"/><circle cx="1110" cy="160" r="1.5"/>
    <circle cx="750" cy="200" r="1.5"/><circle cx="1110" cy="200" r="1.5"/>
    <circle cx="750" cy="240" r="1.5"/><circle cx="1110" cy="240" r="1.5"/>
    <circle cx="750" cy="280" r="1.5"/><circle cx="1110" cy="280" r="1.5"/>
    <circle cx="750" cy="320" r="1.5"/><circle cx="1110" cy="320" r="1.5"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 0)">
    <rect x="0" y="95" width="35" height="4" class="accent" rx="2" />
    <text x="0" y="130" class="text-tag">ENGENHARIA DE IA  •  PYTHON</text>
    <text x="0" y="195" class="text-name">Wellington Roveder</text>
    <text x="0" y="240" class="text-sub">Ciência da Computação  ·  São José dos Campos</text>
  </g>

  <!-- Divider -->
  <line x1="710" y1="75" x2="710" y2="330" class="divider" />

  <!-- Timeline (Right Side) -->
  <g>
    <line x1="810" y1="108" x2="810" y2="278" class="path" />
    <circle cx="810" cy="108" r="4.5" class="accent" />
    <text x="838" y="96" class="timeline-num">01</text>
    <text x="838" y="116" class="timeline-title">AUTOMAÇÃO</text>
    <text x="838" y="138" class="timeline-desc">Fechamento de caixa em uso diário</text>

    <circle cx="810" cy="193" r="4.5" class="accent" />
    <text x="838" y="181" class="timeline-num">02</text>
    <text x="838" y="201" class="timeline-title">BACKEND</text>
    <text x="838" y="223" class="timeline-desc">FastAPI · PostgreSQL</text>

    <circle cx="810" cy="278" r="11" class="halo" />
    <circle cx="810" cy="278" r="4.5" class="accent" />
    <text x="838" y="266" class="timeline-num">03</text>
    <text x="838" y="286" class="timeline-title">ENGENHARIA DE IA</text>
    <text x="838" y="308" class="timeline-desc">LLMs · Embeddings · Tool calling</text>
  </g>

  <!-- Bottom accent bar -->
  <rect x="80" y="394" width="170" height="6" class="accent" />
</svg>
