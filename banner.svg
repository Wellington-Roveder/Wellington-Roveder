<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Wellington Danilo Roveder – Desenvolvedor Python</title>

  <!-- background -->
  <rect width="900" height="280" fill="#0d1117"/>

  <!-- grid lines vertical -->
  <line x1="100" y1="0" x2="100" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="200" y1="0" x2="200" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="300" y1="0" x2="300" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="400" y1="0" x2="400" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="500" y1="0" x2="500" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="600" y1="0" x2="600" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="700" y1="0" x2="700" y2="280" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="800" y1="0" x2="800" y2="280" stroke="#1a2332" stroke-width="0.5"/>

  <!-- grid lines horizontal -->
  <line x1="0" y1="70" x2="900" y2="70" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="0" y1="140" x2="900" y2="140" stroke="#1a2332" stroke-width="0.5"/>
  <line x1="0" y1="210" x2="900" y2="210" stroke="#1a2332" stroke-width="0.5"/>

  <!-- disponível tag -->
  <line x1="44" y1="38" x2="68" y2="38" stroke="#00FF7F" stroke-width="2"/>
  <text x="76" y="43" font-family="'Courier New', monospace" font-size="11" fill="#00FF7F" letter-spacing="2">DISPONÍVEL PARA ESTÁGIO / JÚNIOR</text>

  <!-- name -->
  <text x="44" y="112" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Wellington</text>
  <text x="44" y="174" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="#222b38" letter-spacing="-1">Danilo</text>
  <text x="44" y="236" font-family="'Arial Black', 'Helvetica Neue', sans-serif" font-size="64" font-weight="900" fill="#00FF7F" letter-spacing="-1">Roveder_</text>

  <!-- description -->
  <text x="580" y="160" font-family="'Courier New', monospace" font-size="13" fill="#8b949e">Desenvolvedor Python focado em</text>
  <text x="580" y="180" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" font-weight="bold">automação de processos</text>
  <text x="580" y="200" font-family="'Courier New', monospace" font-size="13" fill="#ffffff" font-weight="bold">e engenharia de dados.</text>
  <text x="580" y="226" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">10 anos de experiência operacional</text>
  <text x="580" y="244" font-family="'Courier New', monospace" font-size="12" fill="#8b949e">→ sistemas eficientes e escaláveis.</text>
</svg>
