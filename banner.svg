<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1f2937"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1280" height="320" fill="#0b0d12"/>
  <rect width="420" height="320" fill="url(#dots)" opacity="0.6"/>
  <rect x="0" y="0" width="860" height="320" fill="url(#dots)" opacity="0.35"/>

  <!-- top tag -->
  <line x1="60" y1="56" x2="90" y2="56" stroke="#00FF7F" stroke-width="2"/>
  <text x="102" y="61" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#00FF7F">DISPONÍVEL PARA ESTÁGIO / JÚNIOR</text>

  <!-- name -->
  <text x="58" y="140" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Wellington</text>
  <text x="58" y="200" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#3a3f4b">Danilo</text>
  <text x="58" y="260" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#00FF7F">Roveder<tspan fill="#00FF7F">_</tspan></text>

  <!-- right side text block -->
  <text x="700" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9aa3af">Desenvolvedor Backend focado em</text>
  <text x="700" y="172" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#e5e7eb">APIs robustas e sistemas escaláveis.</text>

  <text x="700" y="210" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9aa3af">Foco em backend, boas práticas</text>
  <text x="700" y="232" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9aa3af">e arquitetura limpa.</text>
</svg>
