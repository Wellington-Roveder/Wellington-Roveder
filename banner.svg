<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .bg { fill: #12100e; }
      .accent { fill: #d48255; stroke: #d48255; }
      .text-tag { font-family: 'Space Mono', 'Courier New', monospace; font-size: 14px; fill: #d48255; letter-spacing: 2px; font-weight: 700; }
      .text-name { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 48px; fill: #ffffff; font-weight: 700; }
      .text-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 16px; fill: #c0c0c0; font-weight: 400; }
      .timeline-num { font-family: 'Space Mono', 'Courier New', monospace; font-size: 11px; fill: #d48255; font-weight: 700; }
      .timeline-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 18px; fill: #ffffff; font-weight: 700; letter-spacing: 1px; }
      .timeline-desc { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: 13px; fill: #a0a0a0; }
      .dot-grid { fill: #2a2522; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" class="bg" />

  <!-- Background Grid Dots (Right Side) -->
  <g class="dot-grid">
    <circle cx="750" cy="80" r="1.5"/><circle cx="810" cy="80" r="1.5"/><circle cx="870" cy="80" r="1.5"/><circle cx="930" cy="80" r="1.5"/><circle cx="990" cy="80" r="1.5"/><circle cx="1050" cy="80" r="1.5"/><circle cx="1110" cy="80" r="1.5"/>
    <circle cx="750" cy="120" r="1.5"/><circle cx="810" cy="120" r="1.5"/><circle cx="870" cy="120" r="1.5"/><circle cx="930" cy="120" r="1.5"/><circle cx="990" cy="120" r="1.5"/><circle cx="1050" cy="120" r="1.5"/><circle cx="1110" cy="120" r="1.5"/>
    <circle cx="750" cy="160" r="1.5"/><circle cx="810" cy="160" r="1.5"/><circle cx="870" cy="160" r="1.5"/><circle cx="930" cy="160" r="1.5"/><circle cx="990" cy="160" r="1.5"/><circle cx="1050" cy="160" r="1.5"/><circle cx="1110" cy="160" r="1.5"/>
    <circle cx="750" cy="200" r="1.5"/><circle cx="810" cy="200" r="1.5"/><circle cx="870" cy="200" r="1.5"/><circle cx="930" cy="200" r="1.5"/><circle cx="990" cy="200" r="1.5"/><circle cx="1050" cy="200" r="1.5"/><circle cx="1110" cy="200" r="1.5"/>
    <circle cx="750" cy="240" r="1.5"/><circle cx="810" cy="240" r="1.5"/><circle cx="870" cy="240" r="1.5"/><circle cx="930" cy="240" r="1.5"/><circle cx="990" cy="240" r="1.5"/><circle cx="1050" cy="240" r="1.5"/><circle cx="1110" cy="240" r="1.5"/>
    <circle cx="750" cy="280" r="1.5"/><circle cx="810" cy="280" r="1.5"/><circle cx="870" cy="280" r="1.5"/><circle cx="930" cy="280" r="1.5"/><circle cx="990" cy="280" r="1.5"/><circle cx="1050" cy="280" r="1.5"/><circle cx="1110" cy="280" r="1.5"/>
    <circle cx="750" cy="320" r="1.5"/><circle cx="810" cy="320" r="1.5"/><circle cx="870" cy="320" r="1.5"/><circle cx="930" cy="320" r="1.5"/><circle cx="990" cy="320" r="1.5"/><circle cx="1050" cy="320" r="1.5"/><circle cx="1110" cy="320" r="1.5"/>
  </g>

  <!-- Left Content -->
  <g transform="translate(80, 0)">
    <rect x="0" y="95" width="35" height="4" class="accent" rx="2" />
    <text x="0" y="130" class="text-tag">BACKEND  •  JAVA E PYTHON</text>
    <text x="0" y="195" class="text-name">Wellington Roveder</text>
    <text x="0" y="240" class="text-sub">
